[tools]
bun = "1.4.4"

[tasks.install]
description = "Install the JavaScript dependencies"
run = "bun install --silent"

[tasks.dev]
description = "Serve the app with live reload on http://localhost:3000"
depends = ["install"]
run = "bun --port=3000 ./index.html"

[tasks.build]
description = "Bundle the site into dist/ (what GitHub Pages serves)"
depends = ["install"]
run = "rm -rf dist && bun build ./index.html --outdir=dist --sourcemap=linked"

[tasks.preview]
description = "Serve the built dist/ folder on http://localhost:3001 under /human-pnp/ like GitHub Pages"
depends = ["build"]
run = "bun run scripts/serve.ts dist 3001"

[tasks.test]
description = "Run the unit tests (fixture tests run when mise run fixtures has been done)"
depends = ["install"]
run = "bun test"

[tasks.check]
description = "Type-check all TypeScript"
depends = ["install"]
run = "bun x tsc --noEmit -p ."

[tasks.fixtures]
description = "Download KiCad 4-10 demo boards and dump pcbnew ground truth for the fixture tests (needs KiCad)"
run = "scripts/fixtures.sh"

[tasks.e2e]
description = "Build, then drive the site in headless Chromium at phone and desktop size (screenshots in shots/)"
depends = ["build"]
run = "E2E=1 bun test tests/e2e.test.ts"
